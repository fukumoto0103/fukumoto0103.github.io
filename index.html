<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LINE特典詳細</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        /* 全体設定：画像の黄色に合わせる */
        body {
            margin: 0;
            padding: 0;
            background-color: #FFF200; /* 画像に合わせた鮮やかな黄色 */
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 画像コンテナ */
        .image-container {
            width: 100%;
            max-width: 500px; /* PC閲覧時などのための最大幅 */
            line-height: 0; /* 下部の隙間除去 */
        }

        .campaign-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* ボタンエリア（フッター） */
        .footer-area {
            width: 100%;
            max-width: 500px;
            padding: 20px 0;
            background-color: #FFF200;
            display: flex;
            justify-content: center;
            /* iPhoneの下部余白対応 */
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
        }

        .close-btn {
            width: 80%;
            padding: 16px;
            background-color: #333333;
            color: #ffffff;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .close-btn:active {
            background-color: #555555;
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="image-container">
        <img src="./line_aohon.png" alt="キャンペーン特典詳細" class="campaign-img">
    </div>

    <div class="footer-area">
        <button class="close-btn" onclick="liff.closeWindow()">内容を確認して戻る</button>
    </div>

    <script>
        async function main() {
            try {
                // LIFF初期化
                await liff.init({ liffId: "2008386112-wvah7qJd" });
                
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
            } catch (error) {
                console.error('LIFF Init Error:', error);
            }
        }
        main();
    </script>
</body>
</html>
